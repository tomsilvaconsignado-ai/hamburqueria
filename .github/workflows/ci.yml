# CI (typecheck + testes + build) em todo push e pull request.
# Deploy no GitHub Pages apenas em push na main, depois do CI passar.
#
# Pré-requisito (uma vez): Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Sem isso o Pages publica o código-fonte cru da branch e a página fica em branco.
#
# A conexão com o Supabase vem de .env.production (valores públicos).

name: CI / Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  build-pages:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Site de projeto fica em https://<usuario>.github.io/<repositorio>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          # Supabase vem do .env.production versionado (URL + anon key, ambas públicas).
          # Produção nunca pode sair em modo demonstração.
          grep -q '^VITE_SUPABASE_URL=https' .env.production && grep -q '^VITE_SUPABASE_ANON_KEY=.\+' .env.production \
            || { echo "::error::.env.production sem VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY"; exit 1; }
          npm run build
          # Rotas da SPA (/admin, /cozinha...) ao recarregar: o Pages serve o 404.html, que é o próprio app
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
